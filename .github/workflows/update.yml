name: Deploy

on:
  workflow_dispatch:  # 手动触发

permissions:
  contents: write     # 关键：允许 push

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ... 你的构建步骤 ...

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
