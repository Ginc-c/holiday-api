name: Update Holiday Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5    # 升级到 v5，支持 Node 24

      # ... 你的其他步骤（生成图片等）...

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current.jpg
          git diff --cached --quiet || git commit -m "update holiday image"
          git push
